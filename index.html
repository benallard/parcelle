<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Working the Land — Parcelle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:       #f4efe4;
      --cream-dark:  #e8e0d0;
      --ink:         #1e1a12;
      --ink-light:   #5a4e38;
      --ink-faint:   #9a8e78;
      --river:       #7a9aaa;
      --road:        #8a7a60;
      --green-fresh: #4a7c55;
      --brown-done:  #8a7055;
      --field-fill:  rgba(160,140,100,0.10);
      --farmhouse:   #c8b89a;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--cream);
      color: var(--ink);
      font-family: 'EB Garamond', Georgia, serif;
      overflow: hidden;
    }

    /* ── LAYOUT ─────────────────────────────────── */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* LEFT — narrative */
    #narrative {
      width: 36%;
      min-width: 280px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5vw 4vw 5vw 5vw;
      border-right: 1px solid var(--cream-dark);
      position: relative;
      z-index: 2;
    }

    #narrative h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2rem, 3.5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 2rem;
    }

    #narrative h1 em {
      font-style: italic;
      color: var(--ink-light);
    }

    #narrative-text {
      font-size: clamp(1rem, 1.2vw, 1.15rem);
      line-height: 1.75;
      color: var(--ink-light);
      max-width: 36ch;
    }

    #narrative-text p {
      margin-bottom: 1.2em;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #narrative-text p.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #scroll-hint {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      opacity: 0;
      transition: opacity 1s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #scroll-hint.visible { opacity: 1; }

    #scroll-hint::before {
      content: '';
      display: block;
      width: 24px;
      height: 1px;
      background: var(--ink-faint);
    }

    /* RIGHT — canvas */
    #canvas-wrap {
      flex: 1;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    #field-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* paper grain overlay */
    #canvas-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      opacity: 0.6;
    }

    /* ── LOADING VEIL ───────────────────────────── */
    #veil {
      position: fixed;
      inset: 0;
      background: var(--cream);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1.2s ease;
    }

    #veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    #veil-word {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--ink-faint);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 0.4; }
      50%      { opacity: 1;   }
    }

    /* ── FIELD INFO BADGE ───────────────────────── */
    #field-badge {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-family: 'EB Garamond', serif;
      font-size: 0.78rem;
      color: var(--ink-faint);
      letter-spacing: 0.06em;
      text-align: right;
      line-height: 1.6;
      opacity: 0;
      transition: opacity 1s ease 2s;
    }

    #field-badge.visible { opacity: 1; }
  </style>
</head>
<body>

<div id="veil"><span id="veil-word">parcelle</span></div>

<div id="app">

  <!-- LEFT -->
  <aside id="narrative">
    <h1>Working<br/><em>the Land</em></h1>
    <div id="narrative-text">
      <p id="n1">A field. A machine. A task.</p>
      <p id="n2">Every field is different. Every pass is a decision.</p>
      <p id="n3">We'll work through it together — you can let it wash over you, or take the wheel whenever you like.</p>
    </div>
    <div id="scroll-hint">scroll to begin</div>
  </aside>

  <!-- RIGHT -->
  <div id="canvas-wrap">
    <canvas id="field-canvas"></canvas>
    <div id="field-badge" id="field-badge">
      <span id="badge-area">—</span> ha<br/>
      <span id="badge-shape">—</span>
    </div>
  </div>

</div>

<script>
// ── UTILS ────────────────────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function rndInt(min, max) { return Math.floor(rnd(min, max + 1)); }
function lerp(a, b, t) { return a + (b - a) * t; }

// ── CANVAS SETUP ─────────────────────────────────────────────────────
const canvas = document.getElementById('field-canvas');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  render();
}

window.addEventListener('resize', resize);

// ── FIELD GENERATION ─────────────────────────────────────────────────
let field;

function generateField(W, H) {
  // Margin so field never touches edge
  const mx = W * 0.10, my = H * 0.11;
  const fw = W - mx * 2,  fh = H - my * 2;

  // Number of vertices: 4 to 6
  const nv = rndInt(4, 6);

  // Build a convex-ish polygon by placing vertices around an ellipse
  // then jittering them for character
  const cx = mx + fw * 0.5, cy = my + fh * 0.5;
  const rx = fw * rnd(0.36, 0.46);
  const ry = fh * rnd(0.36, 0.46);

  // Start angle random so field orientation varies
  const startAngle = rnd(0, Math.PI * 2 / nv);
  const verts = [];
  for (let i = 0; i < nv; i++) {
    const base = startAngle + (Math.PI * 2 * i / nv);
    const a    = base + rnd(-0.18, 0.18);
    const r    = rnd(0.78, 1.0);
    verts.push({
      x: cx + Math.cos(a) * rx * r,
      y: cy + Math.sin(a) * ry * r,
    });
  }

  // Decide which edge is road, river, hedge
  // road: one edge, river: adjacent or opposite edge
  const roadEdge  = rndInt(0, nv - 1);
  const riverEdge = (roadEdge + rndInt(1, Math.floor(nv / 2))) % nv;

  // Gate: a position along the road edge, t in [0.25, 0.75]
  const gateT    = rnd(0.25, 0.72);
  const gateWidth = rnd(8, 14); // metres — visual only for now

  // Farmhouse notch: cut one corner
  const notchCorner = (roadEdge + rndInt(1, nv - 1)) % nv;
  const notchSize   = rnd(0.12, 0.22); // fraction of adjacent edge length

  // Field area (shoelace, in px²)
  let area = 0;
  for (let i = 0; i < nv; i++) {
    const j = (i + 1) % nv;
    area += verts[i].x * verts[j].y;
    area -= verts[j].x * verts[i].y;
  }
  area = Math.abs(area) / 2;
  // Convert px² → ha (rough: assume 1px ≈ 0.8m at typical zoom)
  const pxPerMetre = W / 140; // rough scale
  const areaHa = (area / (pxPerMetre * pxPerMetre)) / 10000;

  return { verts, nv, roadEdge, riverEdge, notchCorner, notchSize,
           gateT, gateWidth, areaHa, cx, cy };
}

// Compute notched polygon (cut farmhouse corner)
function buildFieldPoly(f) {
  const v = f.verts, n = f.nv;
  const nc = f.notchCorner;
  const prev = (nc - 1 + n) % n;
  const next = (nc + 1) % n;

  const t = f.notchSize;
  // Two points along edges leading to/from the corner
  const p1 = {
    x: lerp(v[nc].x, v[prev].x, t),
    y: lerp(v[nc].y, v[prev].y, t),
  };
  const p2 = {
    x: lerp(v[nc].x, v[next].x, t),
    y: lerp(v[nc].y, v[next].y, t),
  };

  const poly = [];
  for (let i = 0; i < n; i++) {
    if (i === nc) {
      poly.push(p1);
      poly.push({ x: lerp(p1.x, p2.x, 0.5) + rnd(-4,4),
                  y: lerp(p1.y, p2.y, 0.5) + rnd(-4,4) });
      poly.push(p2);
    } else {
      poly.push({ ...v[i] });
    }
  }
  return poly;
}

// ── TRACTOR ──────────────────────────────────────────────────────────
// Draws a minimal top-down tractor at (x,y) rotated by `angle` radians
// scale: metres→pixels
function drawTractor(x, y, angle, scale) {
  const s = scale * 2.2; // tractor body length ~2.2 units
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const ink  = '#1e1a12';
  const fill = '#ede8dc';
  const wfill= '#c8c0a8';

  // Body
  ctx.beginPath();
  ctx.roundRect(-s*0.18, -s*0.5, s*0.36, s, [s*0.06]);
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 1.2; ctx.stroke();

  // Rear wheels (wide rectangles)
  [[-1,1],[1,1]].forEach(([side]) => {
    ctx.beginPath();
    ctx.roundRect(side * s * 0.24, s * 0.08, side < 0 ? -s*0.14 : s*0.14, s*0.38, 2);
    // fix: just use explicit coords
    const wx = side * s * 0.24;
    ctx.beginPath();
    ctx.roundRect(wx, s * 0.08, s * 0.13, s * 0.36, 2);
    ctx.fillStyle = wfill; ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 1; ctx.stroke();
    // tread lines
    ctx.strokeStyle = ink; ctx.lineWidth = 0.6; ctx.globalAlpha = 0.4;
    for (let i = 1; i <= 4; i++) {
      const ty = s * 0.08 + (s * 0.36 * i / 5);
      ctx.beginPath();
      ctx.moveTo(wx, ty);
      ctx.lineTo(wx + s * 0.13, ty);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  // Front wheels (narrow)
  [-1, 1].forEach(side => {
    const wx = side > 0 ? s*0.16 : -s*0.29;
    ctx.beginPath();
    ctx.roundRect(wx, -s*0.46, s*0.13, s*0.2, 2);
    ctx.fillStyle = wfill; ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 0.9; ctx.stroke();
  });

  // Steering wheel
  ctx.beginPath();
  ctx.arc(0, -s*0.1, s*0.07, 0, Math.PI*2);
  ctx.strokeStyle = ink; ctx.lineWidth = 1; ctx.stroke();

  // Seat arc
  ctx.beginPath();
  ctx.arc(0, s*0.28, s*0.1, Math.PI*0.1, Math.PI*0.9);
  ctx.strokeStyle = ink; ctx.lineWidth = 1.8; ctx.stroke();

  // Exhaust (right side, front)
  ctx.beginPath();
  ctx.roundRect(s*0.1, -s*0.42, s*0.04, s*0.1, 1);
  ctx.fillStyle = '#b0a080'; ctx.fill();
  ctx.strokeStyle = ink; ctx.lineWidth = 0.7; ctx.stroke();

  // Smoke wisps
  ctx.save();
  ctx.strokeStyle = '#9a9080'; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.moveTo(s*0.12, -s*0.44);
  ctx.bezierCurveTo(s*0.18, -s*0.55, s*0.10, -s*0.65, s*0.16, -s*0.76);
  ctx.stroke();
  ctx.globalAlpha = 0.22; ctx.lineWidth = 0.6;
  ctx.beginPath();
  ctx.moveTo(s*0.12, -s*0.44);
  ctx.bezierCurveTo(s*0.06, -s*0.57, s*0.14, -s*0.67, s*0.08, -s*0.80);
  ctx.stroke();
  ctx.restore();

  // Three-point hitch
  ctx.strokeStyle = ink; ctx.lineWidth = 0.9; ctx.globalAlpha = 0.55;
  ctx.setLineDash([2,3]);
  [[-s*0.1, s*0.46],[s*0.1, s*0.46],[0, s*0.52]].forEach(([hx,hy]) => {
    ctx.beginPath(); ctx.moveTo(hx*0.6, s*0.4); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx, hy, 2, 0, Math.PI*2); ctx.fillStyle=ink; ctx.fill();
  });
  ctx.setLineDash([]); ctx.globalAlpha = 1;

  ctx.restore();
}

// ── WAVY LINE (river) ────────────────────────────────────────────────
function wavyLine(x1, y1, x2, y2, amp, freq) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len; // normal
  const steps = Math.ceil(len / freq);
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  for (let i = 1; i <= steps; i++) {
    const t  = i / steps;
    const t2 = (i - 0.5) / steps;
    const wave = Math.sin(i * Math.PI) * amp;
    const mx = lerp(x1, x2, t2) + nx * wave;
    const my = lerp(y1, y2, t2) + ny * wave;
    const ex = lerp(x1, x2, t);
    const ey = lerp(y1, y2, t);
    ctx.quadraticCurveTo(mx, my, ex, ey);
  }
}

// ── RENDER ───────────────────────────────────────────────────────────
function render() {
  if (!field) return;
  const W = canvas.offsetWidth, H = canvas.offsetHeight;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#f4efe4';
  ctx.fillRect(0, 0, W, H);

  const f    = field;
  const poly = buildFieldPoly(f);
  const n    = poly.length;

  // ── Field fill
  ctx.beginPath();
  poly.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(155, 138, 100, 0.09)';
  ctx.fill();

  // ── Draw each edge
  for (let i = 0; i < n; i++) {
    const a   = poly[i];
    const b   = poly[(i + 1) % n];
    // map edge index back to original vertex edge
    const origI = i >= f.notchCorner ? i - 2 : i; // rough mapping
    // Determine edge type from original verts
    const vi = i % f.nv;
    const isRoad  = vi === f.roadEdge;
    const isRiver = vi === f.riverEdge;

    if (isRiver) {
      // Two wavy blue-gray lines
      ctx.save();
      ctx.strokeStyle = '#7a9aaa';
      ctx.lineWidth   = 1.8;
      ctx.globalAlpha = 0.7;
      wavyLine(a.x, a.y, b.x, b.y, 4, 18);
      ctx.stroke();
      ctx.strokeStyle = '#9ab4c0';
      ctx.lineWidth   = 0.8;
      ctx.globalAlpha = 0.4;
      const offx = (b.y - a.y) / Math.hypot(b.x-a.x,b.y-a.y) * 5;
      const offy = -(b.x - a.x) / Math.hypot(b.x-a.x,b.y-a.y) * 5;
      wavyLine(a.x+offx, a.y+offy, b.x+offx, b.y+offy, 3, 14);
      ctx.stroke();
      ctx.restore();
    } else if (isRoad) {
      // Double line — road
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.hypot(dx, dy);
      const nx = -dy/len * 3, ny = dx/len * 3;
      ctx.save();
      ctx.strokeStyle = '#8a7a60';
      ctx.lineWidth   = 1;
      ctx.globalAlpha = 0.7;
      ctx.beginPath(); ctx.moveTo(a.x+nx,a.y+ny); ctx.lineTo(b.x+nx,b.y+ny); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(a.x-nx,a.y-ny); ctx.lineTo(b.x-nx,b.y-ny); ctx.stroke();
      // dashed centre
      ctx.strokeStyle = '#b0a080'; ctx.lineWidth = 0.6;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // ── GATE on road edge
      const gx = lerp(a.x, b.x, f.gateT);
      const gy = lerp(a.y, b.y, f.gateT);
      const gdx = (b.x - a.x) / len, gdy = (b.y - a.y) / len;
      const gw  = f.gateWidth;
      ctx.save();
      ctx.fillStyle  = '#f4efe4';
      ctx.fillRect(gx - gdx*gw/2 - ny*0.5, gy - gdy*gw/2 - nx*0.5, gdx*gw + ny, gdy*gw + nx);
      // Gate posts
      ctx.strokeStyle = '#6a5840'; ctx.lineWidth = 2;
      [-gw/2, gw/2].forEach(off => {
        ctx.beginPath();
        ctx.arc(gx + gdx*off, gy + gdy*off, 3, 0, Math.PI*2);
        ctx.fillStyle = '#6a5840'; ctx.fill();
      });
      // Gate bar
      ctx.strokeStyle = '#8a7050'; ctx.lineWidth = 1.2;
      ctx.setLineDash([3,2]);
      ctx.beginPath();
      ctx.moveTo(gx - gdx*gw*0.45, gy - gdy*gw*0.45);
      ctx.lineTo(gx + gdx*gw*0.45, gy + gdy*gw*0.45);
      ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();

    } else {
      // Normal hedge/boundary
      ctx.save();
      ctx.strokeStyle = '#3a3020';
      ctx.lineWidth   = 1.4;
      ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
      // tiny hatch marks suggesting hedge
      const steps = Math.floor(Math.hypot(b.x-a.x,b.y-a.y) / 12);
      const ndx = -(b.y-a.y)/Math.hypot(b.x-a.x,b.y-a.y)*4;
      const ndy =  (b.x-a.x)/Math.hypot(b.x-a.x,b.y-a.y)*4;
      ctx.lineWidth = 0.6; ctx.globalAlpha = 0.3;
      for (let s = 1; s < steps; s++) {
        const t  = s / steps;
        const hx = lerp(a.x, b.x, t), hy = lerp(a.y, b.y, t);
        ctx.beginPath();
        ctx.moveTo(hx, hy); ctx.lineTo(hx+ndx, hy+ndy);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // ── Farmhouse cutout
  const nc  = f.notchCorner;
  const ncv = f.verts[nc];
  const p1  = poly[nc === 0 ? 0 : nc * 2];      // approx notch points
  // Draw a small farmhouse symbol near the notch corner
  const hx = ncv.x, hy = ncv.y;
  const hs = 14;
  ctx.save();
  ctx.fillStyle   = '#d4c4a8';
  ctx.strokeStyle = '#5a4830';
  ctx.lineWidth   = 1;
  ctx.globalAlpha = 0.85;
  // house body
  ctx.fillRect(hx - hs, hy - hs*0.7, hs*2, hs*1.4);
  ctx.strokeRect(hx - hs, hy - hs*0.7, hs*2, hs*1.4);
  // roof lines (top-down: just a slightly darker rect)
  ctx.fillStyle = '#b8a888'; ctx.globalAlpha = 0.6;
  ctx.fillRect(hx - hs*0.9, hy - hs*0.6, hs*1.8, hs*1.2);
  // door
  ctx.fillStyle = '#8a7050'; ctx.globalAlpha = 0.8;
  ctx.fillRect(hx - 3, hy + hs*0.1, 6, hs*0.5);
  ctx.restore();

  // Garden patch (irregular blob near house)
  ctx.save();
  ctx.strokeStyle = '#6a8a5a'; ctx.lineWidth = 0.8;
  ctx.fillStyle   = 'rgba(100,140,80,0.12)';
  ctx.globalAlpha = 0.7;
  ctx.beginPath();
  ctx.ellipse(hx + hs*1.4, hy, hs*0.8, hs*0.6, 0.4, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // ── Tractor at gate
  const roadA = poly[f.roadEdge % poly.length];
  const roadB = poly[(f.roadEdge + 1) % poly.length];
  const tx = lerp(roadA.x, roadB.x, f.gateT);
  const ty = lerp(roadA.y, roadB.y, f.gateT);
  // Angle pointing into field (perpendicular to road edge, inward)
  const rdx = roadB.x - roadA.x, rdy = roadB.y - roadA.y;
  const rlen = Math.hypot(rdx, rdy);
  // Inward normal: rotate 90° toward field centre
  let nx2 = -rdy / rlen, ny2 = rdx / rlen;
  // Check which normal points toward field centroid
  const toCx = f.cx - tx, toCy = f.cy - ty;
  if (nx2 * toCx + ny2 * toCy < 0) { nx2 = -nx2; ny2 = -ny2; }
  const tractorAngle = Math.atan2(nx2, -ny2) + Math.PI;

  // Scale: pixels per metre
  const pxPerM = canvas.offsetWidth / 140;
  drawTractor(tx, ty, tractorAngle, pxPerM * 1.8);

  // ── Field info badge
  document.getElementById('badge-area').textContent  = f.areaHa.toFixed(1);
  document.getElementById('badge-shape').textContent =
    f.nv === 4 ? 'quadrilateral' :
    f.nv === 5 ? 'pentagonal' : 'irregular';
  document.getElementById('field-badge').classList.add('visible');
}

// ── INIT ─────────────────────────────────────────────────────────────
function init() {
  // Let layout settle
  setTimeout(() => {
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    canvas.width  = W * devicePixelRatio;
    canvas.height = H * devicePixelRatio;
    ctx.scale(devicePixelRatio, devicePixelRatio);

    field = generateField(W, H);
    render();

    // Fade out veil
    setTimeout(() => {
      document.getElementById('veil').classList.add('gone');

      // Stagger narrative lines in
      setTimeout(() => document.getElementById('n1').classList.add('visible'), 200);
      setTimeout(() => document.getElementById('n2').classList.add('visible'), 900);
      setTimeout(() => document.getElementById('n3').classList.add('visible'), 1700);
      setTimeout(() => document.getElementById('scroll-hint').classList.add('visible'), 2800);
    }, 600);

  }, 100);
}

window.addEventListener('load', init);
</script>
